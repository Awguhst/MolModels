<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="mm-logo-title">
  <title id="mm-logo-title">Molecules &amp; Models</title>
  <style>
    /* Match the navbar mark, with contrast suited to the browser tab's theme. */
    :root { --bonds: #5E6168; --atoms: #1E2228; --core: #2C5D9B; }
    @media (prefers-color-scheme: dark) {
      :root { --bonds: #B9B1A6; --atoms: #E8E4DC; --core: #86AEE0; }
    }
  </style>
  <g fill="none" stroke="var(--bonds)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="32,6 54.5,19 54.5,45 32,58 9.5,45 9.5,19"/>
    <path d="M32 6V32M54.5 45 32 32M9.5 45 32 32" opacity=".5"/>
  </g>
  <g fill="var(--atoms)">
    <circle cx="32" cy="6" r="4.2"/>
    <circle cx="54.5" cy="19" r="4.2"/>
    <circle cx="54.5" cy="45" r="4.2"/>
    <circle cx="32" cy="58" r="4.2"/>
    <circle cx="9.5" cy="45" r="4.2"/>
    <circle cx="9.5" cy="19" r="4.2"/>
    <circle cx="32" cy="32" r="5.2" fill="var(--core)"/>
  </g>
</svg>
