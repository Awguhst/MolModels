# Brand (dark mode, the default). The same tokens are exposed as CSS custom properties in assets/scss/.
meta:
  name: Molecules & Models
  link: https://YOUR-USER.github.io/molecules-and-models/
color:
  palette:
    bg: "#15181C"
    surface: "#1C2025"
    surface-2: "#242930"
    code-bg: "#101317"
    border: "#2F353D"
    text: "#E8E4DC"
    text-muted: "#A6A197"
    blue: "#86AEE0"
    amber: "#E3AA5C"
    sage: "#93C487"
    rose: "#E39AA9"
  foreground: text
  background: bg
  primary: blue
  secondary: text-muted
  success: sage
  warning: amber
  danger: rose
  info: "#86AEE0"
typography:
  fonts:
    - family: IBM Plex Sans
      source: file
      files:
        - path: ../assets/fonts/IBMPlexSans-Regular.woff2
          weight: 400
          style: normal
        - path: ../assets/fonts/IBMPlexSans-Italic.woff2
          weight: 400
          style: italic
        - path: ../assets/fonts/IBMPlexSans-Medium.woff2
          weight: 500
          style: normal
        - path: ../assets/fonts/IBMPlexSans-SemiBold.woff2
          weight: 600
          style: normal
    - family: Source Serif 4
      source: file
      files:
        - path: ../assets/fonts/SourceSerif4-Semibold.woff2
          weight: 600
          style: normal
        - path: ../assets/fonts/SourceSerif4-SemiboldIt.woff2
          weight: 600
          style: italic
    - family: JetBrains Mono
      source: file
      files:
        - path: ../assets/fonts/JetBrainsMono-Regular.woff2
          weight: 400
          style: normal
        - path: ../assets/fonts/JetBrainsMono-Italic.woff2
          weight: 400
          style: italic
        - path: ../assets/fonts/JetBrainsMono-Bold.woff2
          weight: 700
          style: normal
  base:
    family: IBM Plex Sans
    size: 17px
    line-height: 1.6
  headings:
    family: Source Serif 4
    weight: 600
    line-height: 1.2
  monospace:
    family: JetBrains Mono
    size: 0.853rem
  link:
    color: text
    decoration: underline
