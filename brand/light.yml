# Brand (light mode). The same tokens are exposed as CSS custom properties in assets/scss/.
meta:
  name: Molecules & Models
  link: https://YOUR-USER.github.io/molecules-and-models/
color:
  palette:
    bg: "#FAFAF7"
    surface: "#F1F0EB"
    surface-2: "#E8E6E0"
    code-bg: "#F3F2EE"
    border: "#D8D5CE"
    text: "#1E2228"
    text-muted: "#5E6168"
    blue: "#2C5D9B"
    amber: "#8C5600"
    sage: "#35702A"
    rose: "#A8365A"
  foreground: text
  background: bg
  primary: blue
  secondary: text-muted
  success: sage
  warning: amber
  danger: rose
  info: "#2C5D9B"
typography:
  fonts:
    - family: IBM Plex Sans
      source: file
      files:
        - path: ../assets/fonts/IBMPlexSans-Regular.woff2
          weight: 400
          style: normal
        - path: ../assets/fonts/IBMPlexSans-Italic.woff2
          weight: 400
          style: italic
        - path: ../assets/fonts/IBMPlexSans-Medium.woff2
          weight: 500
          style: normal
        - path: ../assets/fonts/IBMPlexSans-SemiBold.woff2
          weight: 600
          style: normal
    - family: Source Serif 4
      source: file
      files:
        - path: ../assets/fonts/SourceSerif4-Semibold.woff2
          weight: 600
          style: normal
        - path: ../assets/fonts/SourceSerif4-SemiboldIt.woff2
          weight: 600
          style: italic
    - family: JetBrains Mono
      source: file
      files:
        - path: ../assets/fonts/JetBrainsMono-Regular.woff2
          weight: 400
          style: normal
        - path: ../assets/fonts/JetBrainsMono-Italic.woff2
          weight: 400
          style: italic
        - path: ../assets/fonts/JetBrainsMono-Bold.woff2
          weight: 700
          style: normal
  base:
    family: IBM Plex Sans
    size: 17px
    line-height: 1.6
  headings:
    family: Source Serif 4
    weight: 600
    line-height: 1.2
  monospace:
    family: JetBrains Mono
    size: 0.853rem
  link:
    color: text
    decoration: underline
