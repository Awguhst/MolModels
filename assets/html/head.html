<!-- Early theme bootstrap: runs before first paint so there is no flash of the wrong theme.
     Without JavaScript the page is dark (the author default). -->
<script>
(function () {
  var root = document.documentElement;
  try {
    var t = localStorage.getItem('mm-theme') || 'dark';
    var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-mm-theme', dark ? 'dark' : 'light');
    root.setAttribute('data-mm-theme-pref', t);
  } catch (e) {
    root.setAttribute('data-mm-theme', 'dark');
  }
})();
</script>
<meta name="color-scheme" content="dark light">
